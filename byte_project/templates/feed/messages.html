{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="feed-header">
    <div class="header-top">
        <h2>Messages</h2>
        <div style="margin-left: auto;">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" width="20" height="20"><path d="M11 20h2v-8h8v-2h-8V2h-2v8H3v2h8v8z"></path></svg>
        </div>
    </div>
</div>

<div class="messages-content" style="padding: 40px 20px; text-align: center; color: var(--text-secondary); max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; min-height: 50vh;">
    <h1 style="color: var(--text-primary); font-size: 32px; font-weight: 800; margin-bottom: 12px; line-height: 1.2;">Welcome to your inbox!</h1>
    <p style="font-size: 15px; margin-bottom: 24px;">Drop a line, share recipes, or talk about food with fellow chefs. Direct Messages are private conversations.</p>
    <button class="btn-post" style="width: 200px; padding: 16px 0; margin: 0 auto;">Write a message</button>
</div>
{% endblock %}
