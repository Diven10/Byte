{% load humanize %}
<div class="comment" id="comment-{{ comment.pk }}" style="display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border-light); animation: slideIn 0.3s ease-out;">
    <a href="{% url 'accounts:profile' username=comment.author.username %}" style="flex-shrink: 0;">
        <img src="{{ comment.author.profile.get_profile_picture_url }}" alt="{{ comment.author.username }}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
    </a>
    <div style="flex-grow: 1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px;">
            <div style="display: flex; align-items: baseline; gap: 8px;">
                <a href="{% url 'accounts:profile' username=comment.author.username %}" style="font-weight: 700; color: var(--text-primary); text-decoration: none;">{{ comment.author.first_name|default:comment.author.username }}</a>
                <span style="font-size: 13px; color: var(--text-secondary);">@{{ comment.author.username }}</span>
                <span style="font-size: 13px; color: var(--text-muted);">· {{ comment.created_at|naturaltime }}</span>
            </div>
            
            {% if request.user == comment.author %}
            <button class="delete-comment-btn" data-comment-id="{{ comment.pk }}" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s; opacity: 0.5;" title="Delete Comment" onmouseover="this.style.opacity='1'; this.style.color='var(--like-color)';" onmouseout="this.style.opacity='0.5'; this.style.color='var(--text-muted)';">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            {% endif %}
        </div>
        <div style="font-size: 15px; color: var(--text-primary); line-height: 1.5; white-space: pre-line;">{{ comment.text }}</div>
    </div>
</div>
